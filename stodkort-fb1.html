<meta name="mobile-web-app-capable" content="yes">

<title>Stödkort Mark FB1 · Stenriket 5</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F3A5D; --steel:#34667E; --paper:#F5F3ED; --card:#FCFBF8;
    --koppar:#B4551A; --gron:#2E7D43; --gron-ljus:#EAF4EC; --cyan:#1AAFC4;
    --line:#C9D3DC; --text:#22303C;
    --disp:'Barlow Condensed',-apple-system,sans-serif;
    --ui:'Barlow',-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{font-family:var(--ui);background:var(--paper);color:var(--text);
    overscroll-behavior-y:none}
  button{font-family:var(--ui);border:none;background:none;cursor:pointer}
  /* ---------- stämpelhuvud ---------- */
  header{
    position:sticky;top:0;z-index:30;background:var(--card);
    border-bottom:2px solid var(--ink);
    padding:calc(env(safe-area-inset-top) + 8px) 12px 10px 12px;
  }
  .hrad{display:flex;align-items:center;gap:10px}
  .stamp h1{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1;
    letter-spacing:.04em;color:var(--ink);text-transform:uppercase}
  .stamp small{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--steel);margin-top:2px}
  .spacer{flex:1}
  .hbtn{font-family:var(--disp);font-weight:600;font-size:13.5px;letter-spacing:.06em;
    text-transform:uppercase;color:#fff;background:var(--ink);border-radius:5px;
    padding:9px 11px;line-height:1}
  .hbtn.warn{background:var(--koppar)}
  .hbtn.ghost{background:#fff;color:var(--steel);border:1.5px solid var(--line)}
  .hbtn.ghost.aktiv{background:var(--steel);color:#fff;border-color:var(--steel)}
  /* progress */
  .prograd{display:flex;align-items:center;gap:10px;margin-top:9px}
  .spar{flex:1;height:9px;border-radius:5px;background:#E2DFD6;overflow:hidden;
    border:1px solid var(--line)}
  .fyll{height:100%;width:0%;background:linear-gradient(90deg,var(--gron),#3C9A55);
    border-radius:5px;transition:width .35s cubic-bezier(.3,1,.4,1)}
  .progtext{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink);
    min-width:74px;text-align:right}
  /* ---------- sektioner ---------- */
  main{padding:10px 10px calc(env(safe-area-inset-bottom) + 80px) 10px;max-width:760px;margin:0 auto}
  .sek{margin-bottom:14px}
  .sekhuvud{display:flex;align-items:center;gap:9px;background:var(--ink);color:#fff;
    border-radius:7px 7px 0 0;padding:9px 12px}
  .sekhuvud h2{font-family:var(--disp);font-weight:600;font-size:15.5px;
    letter-spacing:.05em;text-transform:uppercase;flex:1}
  .sekprog{font-family:var(--disp);font-weight:700;font-size:13px;opacity:.92}
  .seklinje{height:3px;background:#0B2D49}
  .seklinje div{height:100%;background:#4CAF6D;width:0%;transition:width .3s}
  /* ---------- punktrader ---------- */
  .punkt{background:var(--card);border:1px solid var(--line);border-top:none;
    padding:10px 12px}
  .punkt:last-child{border-radius:0 0 7px 7px}
  .punkt.klar{background:var(--gron-ljus)}
  .prad{display:flex;gap:11px;align-items:flex-start}
  .bock{flex:0 0 34px;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--steel);
    background:#fff;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .bock svg{width:19px;height:19px;opacity:0;transform:scale(.4)}
  .punkt.klar .bock{background:var(--gron);border-color:var(--gron)}
  .punkt.klar .bock svg{opacity:1;transform:scale(1);
    transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .15s}
  .pinneh{flex:1;min-width:0}
  .ptitel{font-size:15px;font-weight:600;color:var(--ink);line-height:1.25}
  .punkt.klar .ptitel{color:var(--gron)}
  .pstod{font-size:12.5px;color:var(--steel);line-height:1.45;margin-top:2px}
  .pmarken{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
  .marke{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.05em;
    border-radius:4px;padding:2px 7px;text-transform:uppercase}
  .marke.foto{background:#fff;border:1px solid var(--ink);color:var(--ink)}
  .marke.not{background:#FBEFE6;border:1px solid var(--koppar);color:var(--koppar)}
  .pknapp{flex:0 0 auto;width:38px;height:38px;border-radius:7px;border:1.5px solid var(--line);
    background:#fff;display:flex;align-items:center;justify-content:center;color:var(--steel)}
  .pknapp svg{width:20px;height:20px}
  /* detalj (expanderad) */
  .detalj{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .punkt.oppen .detalj{display:block}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;background:#fff;
    font-family:var(--ui);font-size:14.5px;padding:9px;min-height:54px;resize:none;color:var(--text)}
  textarea:focus{outline:2px solid var(--cyan);border-color:transparent}
  .foton{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}
  .foton .tumnagel{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;
    border:1.5px solid var(--line);background:#eee}
  .foton img{width:100%;height:100%;object-fit:cover;display:block}
  .foton .upl{position:absolute;right:3px;top:3px;width:11px;height:11px;border-radius:50%;
    background:var(--gron);border:1.5px solid #fff;display:none}
  .foton .tumnagel.klar .upl{display:block}
  .dknappar{display:flex;gap:9px;margin-top:10px}
  .stor{flex:1;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.06em;
    text-transform:uppercase;border-radius:8px;padding:13px 8px;line-height:1}
  .stor.kamera{background:var(--koppar);color:#fff;box-shadow:0 3px 0 #8F4413}
  .stor.kamera:active{transform:translateY(2px);box-shadow:0 1px 0 #8F4413}
  .stor.tunn{background:#fff;border:1.5px solid var(--line);color:var(--steel)}
  /* fullbild */
  #full{position:fixed;inset:0;z-index:70;background:rgba(8,20,30,.96);display:none;
    flex-direction:column}
  #full.synlig{display:flex}
  #full img{flex:1;object-fit:contain;min-height:0}
  #full .rad{display:flex;gap:10px;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px)}
  #full .rad button{flex:1;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;
    padding:13px;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
  #full .rad button.bort{border-color:#D06A6A;color:#F0A0A0}
  /* toast + konfetti-läge */
  #toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;
    transform:translateX(-50%) translateY(12px);z-index:80;background:var(--ink);color:#fff;
    border-radius:7px;padding:10px 16px;font-size:13.5px;font-weight:500;opacity:0;
    transition:all .22s;pointer-events:none;max-width:86vw;text-align:center}
  #toast.synlig{opacity:1;transform:translateX(-50%) translateY(0)}
  .allklar{background:var(--gron) !important}
</style>
</head>

<script>

  {rubrik:'Återställning och renhet', punkter:[
    ['7.1','Befintligt återställt (XX, BP, KS)','Återanvända plattor och kantstöd utan skador.'],
    ['7.2','Träd','Bevarade träd oskadade (stam, rotzon). Rivna träd borttagna inklusive stubbar.'],
    ['7.3','Byggrester och etablering','Borta från färdiga ytor.'],
    ['7.4','Angränsande mark','Skador utanför entreprenadgränsen noteras som förhållande. Stäm av mot försynsprotokollet.'],
  ]},
  {rubrik:'Dokumentation att begära (S-listan)', punkter:[
    ['8.1','Egenkontroll packning och överbyggnad','Under samtliga hårdgjorda ytor.'],
    ['8.2','Egenkontroll växtbäddar','Jorddjup och jordtyp per yta: PL, PL1, PL2.'],
    ['8.3','Egenkontroll VA','Läggning, bädd, kringfyllning. Eventuella spolnings- och filmningsprotokoll.'],
    ['8.4','Materialintyg','Betongplattor, granitkantstöd och plantskolans följesedlar mot växtförteckningen.'],
    ['8.5','Relationsunderlag VA i mark',''],
    ['8.6','Skötsel- och etableringsinstruktion','För planteringar och sådda ytor.'],
  ]},
];
const ALLA = CHECKLISTA.flatMap(s => s.punkter.map(p => p[0]));

/* ============ state ============ */
let status = {};   // id -> {id, klar, not, ts, metaSynkad}
let foton = [];    // {id, punktId, blob, ts, uploaded}
let kameraPunkt = null;
let visaBaraKvar = false;
const $ = s => document.querySelector(s);

/* ============ IndexedDB ============ */
let db;
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('inspectiq-chk-mark', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains('status')) d.createObjectStore('status', {keyPath:'id'});
      if(!d.objectStoreNames.contains('foton')) d.createObjectStore('foton', {keyPath:'id'});
    };
    r.onsuccess = () => {db = r.result; res();};
    r.onerror = () => rej(r.error);
  });
}
function idbPut(store, val){return new Promise((res, rej) => {
  const t = db.transaction(store, 'readwrite'); t.objectStore(store).put(val);
  t.oncomplete = res; t.onerror = () => rej(t.error);});}
function idbDel(store, key){return new Promise((res, rej) => {
  const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(key);
  t.oncomplete = res; t.onerror = () => rej(t.error);});}
function idbAll(store){return new Promise((res, rej) => {
  const t = db.transaction(store, 'readonly'); const q = t.objectStore(store).getAll();
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);});}

function st(id){
  if(!status[id]) status[id] = {id, klar:false, not:'', ts:null, metaSynkad:true};
  return status[id];
}
function punktFoton(id){ return foton.filter(f => f.punktId === id); }
function rubrikFor(id){
  for(const s of CHECKLISTA) for(const p of s.punkter) if(p[0] === id) return p[1];
  return id;
}

/* ============ rendering ============ */
const BOCK_SVG = '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 9.5 18 20 6.5" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const KAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8.5a2 2 0 0 1 2-2h2l1.4-2h7.2l1.4 2h2a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.6"/></svg>';

function rita(){
  const m = $('#lista'); m.innerHTML = '';
  for(const sek of CHECKLISTA){
    const idn = sek.punkter.map(p => p[0]);
    const klara = idn.filter(id => st(id).klar).length;
    const synliga = visaBaraKvar ? sek.punkter.filter(p => !st(p[0]).klar) : sek.punkter;
    if(visaBaraKvar && !synliga.length) continue;
    const d = document.createElement('div'); d.className = 'sek';
    d.innerHTML = `<div class="sekhuvud"><h2>${sek.rubrik}</h2>
      <span class="sekprog">${klara}/${idn.length}</span></div>
      <div class="seklinje"><div style="width:${idn.length ? (klara/idn.length*100) : 0}%"></div></div>`;
    for(const [id, titel, stod] of synliga){
      const s = st(id), pf = punktFoton(id);
      const rad = document.createElement('div');
      rad.className = 'punkt' + (s.klar ? ' klar' : '') + (s.oppen ? ' oppen' : '');
      rad.dataset.id = id;
      const marken = [];
      if(pf.length) marken.push(`<span class="marke foto">${pf.length} foto${pf.length === 1 ? '' : 'n'}</span>`);
      if(s.not) marken.push(`<span class="marke not">Notering</span>`);
      rad.innerHTML = `
        <div class="prad">
          <button class="bock" data-roll="bock" aria-label="Bocka av">${BOCK_SVG}</button>
          <div class="pinneh" data-roll="oppna">
            <div class="ptitel">${titel}</div>
            ${stod ? `<div class="pstod">${stod}</div>` : ''}
            ${marken.length ? `<div class="pmarken">${marken.join('')}</div>` : ''}
          </div>
          <button class="pknapp" data-roll="kamera" aria-label="Ta bild">${KAM_SVG}</button>
        </div>
        <div class="detalj">
          <textarea data-roll="not" placeholder="Notering: diktera med mikrofonen eller skriv kort.">${s.not || ''}</textarea>
          <div class="foton" data-roll="foton"></div>
          <div class="dknappar">
            <button class="stor kamera" data-roll="kamera">Ta bild</button>
            <button class="stor tunn" data-roll="stang">Stäng</button>
          </div>
        </div>`;
      ritaFoton(rad, id);
      d.appendChild(rad);
    }
    m.appendChild(d);
  }
  uppdateraProgress();
}

function ritaFoton(rad, id){
  const g = rad.querySelector('[data-roll="foton"]');
  if(!g) return;
  g.innerHTML = '';
  for(const f of punktFoton(id)){
    const t = document.createElement('div');
    t.className = 'tumnagel' + (f.uploaded ? ' klar' : '');
    const im = document.createElement('img'); im.src = URL.createObjectURL(f.blob);
    t.appendChild(im);
    const u = document.createElement('div'); u.className = 'upl'; t.appendChild(u);
    t.onclick = () => visaFull(f);
    g.appendChild(t);
  }
}

function uppdateraProgress(){
  const klara = ALLA.filter(id => st(id).klar).length;
  const pct = Math.round(klara / ALLA.length * 100);
  $('#fyll').style.width = pct + '%';
  $('#progtext').textContent = `${klara} av ${ALLA.length}`;
  const osynk = foton.filter(f => !f.uploaded).length +
    Object.values(status).filter(s => s.metaSynkad === false).length;
  const b = $('#btnSynk');
  b.textContent = osynk ? `Synka (${osynk})` : 'Synkat';
  b.classList.toggle('warn', !!osynk);
  if(klara === ALLA.length && ALLA.length){
    $('#fyll').classList.add('allklar');
  } else $('#fyll').classList.remove('allklar');
}

/* ============ interaktion (event delegation) ============ */
$('#lista').addEventListener('click', e => {
  const roll = e.target.closest('[data-roll]');
  if(!roll) return;
  const rad = e.target.closest('.punkt');
  if(!rad) return;
  const id = rad.dataset.id;
  const r = roll.dataset.roll;
  if(r === 'bock'){
    const s = st(id);
    s.klar = !s.klar; s.ts = new Date().toISOString(); s.metaSynkad = false;
    idbPut('status', s);
    rita(); synkaTyst();
    if(s.klar){
      const klara = ALLA.filter(x => st(x).klar).length;
      if(klara === ALLA.length) toast('Alla punkter avbockade. Snyggt jobbat.');
    }
  } else if(r === 'kamera'){
    kameraPunkt = id;
    kamIn.value = '';
    kamIn.click();              // synkront: iOS kräver obruten användargest
    const s = st(id); if(!s.ts){ s.ts = new Date().toISOString(); idbPut('status', s); }
  } else if(r === 'oppna'){
    const s = st(id); s.oppen = !s.oppen;
    rad.classList.toggle('oppen', s.oppen);
  } else if(r === 'stang'){
    st(id).oppen = false;
    rad.classList.remove('oppen');
  }
});
$('#lista').addEventListener('input', e => {
  if(e.target.dataset.roll !== 'not') return;
  const rad = e.target.closest('.punkt'); if(!rad) return;
  const s = st(rad.dataset.id);
  s.not = e.target.value; s.metaSynkad = false;
});
$('#lista').addEventListener('focusout', e => {
  if(e.target.dataset.roll !== 'not') return;
  const rad = e.target.closest('.punkt'); if(!rad) return;
  const s = st(rad.dataset.id);
  s.ts = new Date().toISOString();
  idbPut('status', s); rita(); synkaTyst();
});

$('#btnFilter').onclick = () => {
  visaBaraKvar = !visaBaraKvar;
  $('#btnFilter').classList.toggle('aktiv', visaBaraKvar);
  $('#btnFilter').textContent = visaBaraKvar ? 'Alla' : 'Kvar';
  rita();
};

/* ============ kamera ============ */
const kamIn = $('#kamIn');
kamIn.addEventListener('change', async () => {
  const fil = kamIn.files && kamIn.files[0];
  if(!fil || !kameraPunkt) return;
  toast('Sparar bild ...');
  try{
    const blob = await krympBild(fil, 1600, .8);
    const f = {id:crypto.randomUUID(), punktId:kameraPunkt, blob,
      ts:new Date().toISOString(), uploaded:false};
    foton.push(f);
    await idbPut('foton', f);
    const s = st(kameraPunkt); s.oppen = true;
    rita(); toast(`Bild sparad på ${kameraPunkt} ${rubrikFor(kameraPunkt)}`);
    synkaTyst();
  }catch(err){ toast('Kunde inte spara bilden: ' + err.message); }
});
async function krympBild(fil, maxDim, kval){
  let bmp;
  try{ bmp = await createImageBitmap(fil, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await createImageBitmap(fil); }
  const k = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', kval));
}

/* ============ fullbild ============ */
let fullFoto = null;
function visaFull(f){
  fullFoto = f;
  $('#fullImg').src = URL.createObjectURL(f.blob);
  $('#full').classList.add('synlig');
}
$('#fullStang').onclick = () => $('#full').classList.remove('synlig');
$('#fullBort').onclick = async () => {
  if(!fullFoto) return;
  if(!confirm('Ta bort bilden?')) return;
  foton = foton.filter(x => x.id !== fullFoto.id);
  await idbDel('foton', fullFoto.id);
  $('#full').classList.remove('synlig');
  rita();
};

/* ============ synk till Supabase ============ */
let synkPågår = false;
async function synkaTyst(){ if(navigator.onLine) synka(true); }
async function synka(tyst){
  if(synkPågår) return; synkPågår = true;
  let ok = 0, fel = 0;
  try{
    for(const f of foton.filter(x => !x.uploaded)){
      try{
        const path = `foton/chk_${f.punktId.replace('.', '-')}_${f.id.slice(0, 8)}.jpg`;
        const r1 = await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`, {
          method:'POST',
          headers:{'Authorization':'Bearer ' + SUPA_KEY, 'apikey':SUPA_KEY,
            'Content-Type':'image/jpeg', 'x-upsert':'true'},
          body:f.blob});
        if(!r1.ok && r1.status !== 409) throw new Error('storage ' + r1.status);
        const s = st(f.punktId);
        const r2 = await fetch(`${SUPA_URL}/rest/v1/${TABLE}`, {
          method:'POST',
          headers:{'Authorization':'Bearer ' + SUPA_KEY, 'apikey':SUPA_KEY,
            'Content-Type':'application/json', 'Prefer':'return=minimal'},
          body:JSON.stringify({projekt:PROJEKT, punkt_id:f.punktId,
            rubrik:rubrikFor(f.punktId), status:s.klar ? 'klar' : 'ej',
            notering:s.not || null, foto_path:path, klient_ts:f.ts})});
        if(!r2.ok) throw new Error('rest ' + r2.status);
        f.uploaded = true; await idbPut('foton', f); ok++;
      }catch(e){ fel++; }
    }
    for(const s of Object.values(status).filter(x => x.metaSynkad === false)){
      try{
        const r3 = await fetch(`${SUPA_URL}/rest/v1/${TABLE}`, {
          method:'POST',
          headers:{'Authorization':'Bearer ' + SUPA_KEY, 'apikey':SUPA_KEY,
            'Content-Type':'application/json', 'Prefer':'return=minimal'},
          body:JSON.stringify({projekt:PROJEKT, punkt_id:s.id, rubrik:rubrikFor(s.id),
            status:s.klar ? 'klar' : 'ej', notering:s.not || null,
            foto_path:null, klient_ts:s.ts || new Date().toISOString()})});
        if(r3.ok){ s.metaSynkad = true; await idbPut('status', s); ok++; }
        else fel++;
      }catch(e){ fel++; }
    }
  } finally {
    synkPågår = false; uppdateraProgress();
    if(!tyst){
      if(fel) toast(`Synk: ${ok} skickade, ${fel} kvar. Försök igen vid täckning.`);
      else if(ok) toast(`Synk klar: ${ok} poster.`);
      else toast('Allt är redan synkat.');
    }
  }
}
$('#btnSynk').onclick = () => synka(false);
window.addEventListener('online', synkaTyst);
document.addEventListener('visibilitychange', () => { if(!document.hidden) synkaTyst(); });

/* ============ övrigt ============ */
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('synlig');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('synlig'), 2400);
}

/* ============ start ============ */
(async function(){
  await idbOpen();
  for(const s of await idbAll('status')) status[s.id] = s;
  foton = await idbAll('foton');
  rita();
})();
</script>
